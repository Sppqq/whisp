name: PR test build

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr-test-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: PR test build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Verify toolchain
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Build and run tests
        shell: bash
        run: |
          xcodebuild \
            -project Whisp.xcodeproj \
            -scheme Whisp \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/WhispPR" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test
