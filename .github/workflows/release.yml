name: Release Whisp

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без v; пусто — вычислить автоматически"
        required: false
        type: string
      channel:
        description: "Канал для ручного запуска"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - alpha
          - rc
      bump:
        description: "Увеличение версии, если version пустая"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
    name: Build, notarize and publish
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      VERSION_INPUT: ${{ inputs.version }}
      CHANNEL_INPUT: ${{ inputs.channel }}
      BUMP_INPUT: ${{ inputs.bump }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version and changelog
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANNEL="alpha"
            VERSION="$(python3 scripts/next_version.py --channel alpha --bump patch)"
          else
            CHANNEL="$CHANNEL_INPUT"
            if [[ -n "$VERSION_INPUT" ]]; then
              VERSION="$VERSION_INPUT"
            else
              VERSION="$(python3 scripts/next_version.py --channel "$CHANNEL" --bump "$BUMP_INPUT")"
            fi
          fi
          if [[ "$GITHUB_REF_NAME" == "dev" && "$CHANNEL" == "stable" ]]; then
            echo "Стабильные релизы запускаются из main" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == "main" && "$CHANNEL" != "stable" ]]; then
            echo "Alpha/RC-релизы запускаются из dev" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Некорректная версия: $VERSION" >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && "$VERSION" == *-* ]]; then
            echo "Для stable нельзя указывать prerelease-версию: $VERSION" >&2
            exit 1
          fi
          if [[ "$CHANNEL" != "stable" && "$VERSION" != *-* ]]; then
            echo "Для $CHANNEL нужна prerelease-версия: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          mkdir -p dist
          if [[ "$CHANNEL" == "stable" ]]; then
            PREVIOUS_STABLE="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import next_version; stable=next_version.stable_tags(); print(max(stable)[3] if stable else "")')"
            if [[ -n "$PREVIOUS_STABLE" ]]; then
              python3 scripts/release_notes.py --aggregate-since "$PREVIOUS_STABLE" --output dist/release-notes.md
            else
              python3 scripts/release_notes.py "$VERSION" --output dist/release-notes.md
            fi
          else
            if ! python3 scripts/release_notes.py Unreleased --output dist/release-notes.md; then
              {
                echo "### Изменения"
                git log --format='- %s' -20 "$GITHUB_SHA"
              } > dist/release-notes.md
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Determine signing mode
        shell: bash
        run: |
          required=(
            APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY APPLE_TEAM_ID
            APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
          )
          SIGNED_RELEASE=true
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then SIGNED_RELEASE=false; fi
          done
          echo "SIGNED_RELEASE=$SIGNED_RELEASE" >> "$GITHUB_ENV"
          if [[ "$SIGNED_RELEASE" == true ]]; then
            echo "WHISP_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "WHISP_DEVELOPMENT_TEAM=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          else
            echo "WHISP_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "WHISP_DEVELOPMENT_TEAM=" >> "$GITHUB_ENV"
            {
              echo "> [!WARNING]"
              echo "> Это ad-hoc beta-сборка без notarization Apple. При первом запуске macOS может потребовать открыть приложение через контекстное меню «Открыть»."
              echo
              cat dist/release-notes.md
            } > dist/release-notes.tmp
            mv dist/release-notes.tmp dist/release-notes.md
          fi

      - name: Verify Xcode and install XcodeGen
        shell: bash
        run: |
          brew install xcodegen
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcodegen --version

      - name: Import Developer ID certificate
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/whisp-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12

      - name: Run tests
        shell: bash
        run: |
          xcodegen generate
          xcodebuild \
            -project Whisp.xcodeproj \
            -scheme Whisp \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/WhispTests" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test

      - name: Build signed DMG
        shell: bash
        env:
          WHISP_VERSION: ${{ env.VERSION }}
          WHISP_BUILD_NUMBER: ${{ github.run_number }}
          WHISP_SIGNING_IDENTITY: ${{ env.WHISP_SIGNING_IDENTITY }}
          WHISP_DEVELOPMENT_TEAM: ${{ env.WHISP_DEVELOPMENT_TEAM }}
          WHISP_DERIVED_DATA: ${{ runner.temp }}/WhispRelease
        run: bash scripts/build_dmg.sh

      - name: Notarize and staple DMG
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          DMG="dist/Whisp-${VERSION}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --verbose "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Publish GitHub Release
        shell: bash
        run: |
          RELEASE_FLAGS=()
          if [[ "$CHANNEL" != stable || "$SIGNED_RELEASE" != true ]]; then RELEASE_FLAGS+=(--prerelease); fi
          gh release create "$TAG" \
            "dist/Whisp-${VERSION}.dmg" \
            "dist/Whisp-${VERSION}.dmg.sha256" \
            --target "$GITHUB_SHA" \
            --title "Whisp $VERSION" \
            --notes-file dist/release-notes.md \
            "${RELEASE_FLAGS[@]}"

      - name: Finalize changelog
        if: success()
        shell: bash
        run: |
          python3 scripts/finalize_changelog.py "$VERSION" --date "$(date -u +%Y-%m-%d)"
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: finalize changelog for v$VERSION [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Delete temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
