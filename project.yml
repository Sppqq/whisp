name: Whisp
options:
  bundleIdPrefix: app.whisp
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.1.6"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.0.0
targets:
  Whisp:
    type: application
    platform: macOS
    sources:
      - path: Whisp
        excludes:
          - Resources/Info.plist
          - Resources/Whisp.entitlements
    info:
      path: Whisp/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Whisp/Resources/Whisp.entitlements
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.whisp.lectures
        PRODUCT_NAME: Whisp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
  WhispTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WhispTests
    dependencies:
      - target: Whisp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.whisp.lectures.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Whisp:
    build:
      targets:
        Whisp: all
        WhispTests: [test]
    test:
      targets:
        - WhispTests
